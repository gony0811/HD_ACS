# ---------------------------------------------------------------------------
# 아덴트로봇 TARS-M v3 REST API — ACS 대조본 (사내 계약 사본)
#
#  ※ 벤더 공식 산출물이 아니다. 벤더는 사양서를 제공하지 않았고(1차 질의 1.1 회신),
#    이 파일은 로봇에서 직접 추출한 실물 스펙 + 벤더 회신의 의미 해석을 합친 것이다.
#
#  출처
#    - 로봇 http://<robot>/api/v3/swagger-ui-init.js 의 인라인 swaggerDoc
#      (Swagger 2.0 / title TARS-AMR / version 3.18.0, 2026-09-01 수집)
#      → 경로·요청 body·설명문은 이 실물 스펙이 정본
#    - docs/ADENT_TARSM_V3_ENDPOINTS.md  실물 전체 엔드포인트 목록
#    - docs/ADENT_VENDOR_INQUIRY.md      1차 질의(2026-08-28) + 회신(2026-09-01)
#      → 응답 envelope·큐 append·좌표계·stopFlag 의 "의미"는 이 회신이 근거
#    - docs/ADENT_VENDOR_INQUIRY_2.md    2차 질의(2026-09-01) — 미확인 항목 번호 참조
#
#  ★ 실물 스펙의 결정적 한계
#    실물 스펙에는 **응답 스키마가 하나도 없다**. 모든 엔드포인트가 `200 OK` 뿐이다.
#    따라서 아래의 요청부는 CONFIRMED 이지만, **응답부는 전부 회신 문언 기반의 추정**이다.
#    응답 필드에 의존하는 코드는 2차 A장 회신 전까지 방어적으로 작성할 것.
#
#  이 파일에 실린 범위
#    실물 스펙에는 ~70 개 경로가 있다. 여기에는 HD_AMR 온보드 S/W 가 실제로 쓰는 것과
#    설계 판단에 영향을 주는 것만 옮겼다. 전수 목록은 ADENT_TARSM_V3_ENDPOINTS.md 참조.
#
#  신뢰도 표기 (각 요소의 x-confidence)
#    CONFIRMED   — 실물 스펙 또는 벤더 회신 문언으로 확정. 근거를 x-source 에 기재
#    INFERRED    — 실물 스펙의 설명문/회신에서 합리적으로 추정. 구현 전 검증 필요
#    UNCONFIRMED — 미확인. x-todo 의 2차 질의 회신 전까지 코드에서 가정하지 말 것
# ---------------------------------------------------------------------------
openapi: 3.0.3

info:
  title: TARS-M v3 REST API (ACS 대조본)
  version: 0.2.0-spec-matched
  description: |
    아덴트로봇 TARS-M AMR 의 v3 REST 인터페이스. HD_AMR 통합 운영 S/W 가 주행 명령·상태 조회에 사용한다.
    HD_ACS 는 이 API 를 직접 호출하지 않는다 — ACS 의 상대는 VDA 5050(MQTT) 하나뿐이며,
    이 문서는 **HD_AMR 온보드 S/W 구현과 벤더 회신 대조를 위한 참조 사양**이다.

    ## 확정된 전역 규약
    - 인증 **없음**, 기본 **80 포트**, `schemes: [http]` (1차 1.1 회신 + 실물 스펙)
    - basePath `/api/v3`
    - 모든 응답은 공통 envelope: 성공 `{code: 0, data: {}}` / 실패 `{code: N, message: ""}` (1차 2.1 회신)
    - `POST /robot/go` 는 **비동기(명령 수리)**. 완료 판정은 `GET /robot/status` 의 `schedule`,
      실패는 같은 응답의 `error` 로 폴링한다 (1차 2.2/2.3 회신)
    - `POST /robot/go` 는 **대체가 아니라 목적지 큐 추가(append)**.
      진행 중 이동을 멈추고 다른 목적지로 보내려면 **먼저 `POST /robot/state`** 를 호출해야 한다 (1차 2.6/2.7 회신)
    - 좌표는 SLAM 맵 원점 기준, **원점 = 맵 좌측 하단**, `rz` 는 맵 X축 기준 **CCW 라디안** (1차 2.5 회신)

    ## 실물 스펙 확보로 새로 확정된 설계 선택지
    1. `POST /robot/pose` — REST 재측위가 존재한다. 층 전환을 **Modbus 없이** 구현 가능.
    2. `GET /robot/pose` — 응답에 **맵 일치율**이 포함된다. 층 전환 검증 지표를 REST 로 읽는다.
    3. `POST /robot/modbus` — 홀딩 레지스터를 REST 로 쓸 수 있다. Modbus TCP 세션 없이도 레지스터 기능 사용 가능.
    4. `POST /map/load` — 층별 맵 전환이 REST 로 가능하다. **통합맵 단일화 외의 대안이 살아 있다.**
    5. `POST /plan/waypoint` — 거점 좌표를 REST 로 직접 등록/수정할 수 있다(맵 에디터 수작업 불요).
  x-status: SPEC-MATCHED
  x-generated: "2026-09-01"
  x-source-spec: "TARS-AMR 3.18.0 (Swagger 2.0), robot /api/v3/swagger-ui-init.js"
  x-owner: HD_ACS
  contact:
    name: 아덴트로봇 (벤더)

servers:
  - url: http://{robotHost}/api/v3
    description: 로봇 온보드 REST 서버 (폐쇄망)
    variables:
      robotHost:
        default: 10.10.100.200
        description: |
          시험 로봇 주소(2026-09-01 확인). 현장 로봇은 주소가 다를 수 있다.
          포트는 80(기본)이므로 URL 에 표기하지 않는다.

tags:
  - name: robot
    description: 주행 명령 및 상태
  - name: pose
    description: 위치 조회 및 재측위
  - name: map
    description: 맵 로드/조회
  - name: plan
    description: 거점(waypoint) 등 플랜 리소스

paths:

  # ---------------------------------------------------------------- 주행 발행
  /robot/go:
    post:
      tags: [robot]
      operationId: robotGo
      summary: 좌표 이동 명령 (비동기 · 큐 추가)
      description: |
        실물 스펙 설명문: "좌표 이동".
        지정 좌표로의 이동 작업을 **큐에 추가**한다. 응답은 **명령 수리**이며 도착을 의미하지 않는다.

        **주의 — 목적지 교체가 아니다.**
        이동 중 이 API 를 다시 호출하면 현재 이동이 대체되지 않고 **다음 목적지로 등록**된다.
        따라서 "지금 가는 곳을 취소하고 다른 곳으로" 는 반드시
        `POST /robot/state`(정지/큐 정리) → `POST /robot/go` 순서로 수행해야 한다.
        이를 지키지 않으면 로봇이 이전 목적지를 먼저 경유하며, 로봇 자체는 정상 동작하므로
        **검사 위치만 틀리는 형태로 조용히 실패**한다.

        진행 상태는 `GET /robot/status` 의 `schedule`, 실패는 `error` 로 확인한다.
      x-confidence: CONFIRMED
      x-source: 실물 스펙 /robot/go + 1차 질의 2.2/2.4/2.5/2.6 회신
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoRequest'
            examples:
              inspectionStop:
                summary: 검사 정차점 (각도 보정 필요 → stopFlag=true)
                value: {x: 12.34, y: 5.67, rz: 1.5708, stopFlag: true}
              waypoint:
                summary: 경유점 (정차 없이 통과 — 현 ACS 계약에서는 미사용)
                value: {x: 3.0, y: 2.0, rz: 0.0, stopFlag: false}
      responses:
        '200':
          $ref: '#/components/responses/Envelope'
      x-todo:
        - "2차 A-1/A-4 — 실패 code 값 목록·의미 (로봇 에러코드와 같은 체계인지)"
        - "2차 C-2 — /go 큐와 /job/add · /plan/task 의 관계"
        - "2차 C-3 — 큐 최대 길이 및 초과 시 동작, 큐 조회 가능 여부"
        - "2차 C-4 — stopFlag=true 시 통상 정차 오차(위치 m / 각도 rad)"

  /robot/job/add:
    post:
      tags: [robot]
      operationId: robotJobAdd
      summary: 현재 Task 에 좌표 기반 거점 Job 추가
      description: |
        실물 스펙 설명문: "현재 Task 에 좌표 기반의 거점 Job 을 추가".
        요청 body 가 `/robot/go` 와 동일(`x, y, rz, stopFlag`)이라 **둘의 관계가 모호하다**.
        벤더 회신에서 말한 "큐"가 `/go` 의 내부 큐인지 이 Task 인지 확정 전에는
        **온보드 구현에서 이 엔드포인트를 사용하지 말 것**. 주행 발행은 `/robot/go` 로 단일화한다.
      x-confidence: UNCONFIRMED
      x-source: 실물 스펙 /robot/job/add (설명문만, 관계 미확인)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoRequest'
      responses:
        '200':
          $ref: '#/components/responses/Envelope'
      x-todo:
        - "2차 C-2 — /go · /job/add · /plan/task · /task/clear 의 관계"

  # ---------------------------------------------------------------- 상태 판정
  /robot/status:
    get:
      tags: [robot]
      operationId: robotStatus
      summary: 로봇 상태 조회 (이동 완료·실패 판정 경로)
      description: |
        실물 스펙 설명문: "현재 상태 조회".
        `/robot/go` 의 진행/완료는 `data.schedule`, 실패는 `data.error` 로 확인한다(1차 2.2/2.3 회신).
        **응답 스키마는 실물 스펙에도 없다**(`200 OK` 뿐) — 아래 `RobotStatus` 는 회신에 언급된
        두 필드만 담은 골격이며, 실제 응답에는 위치·배터리·모드 등 다른 필드가 더 있을 것으로 본다.
      x-confidence: INFERRED
      x-source: 실물 스펙(경로) + 1차 2.2/2.3 회신(필드명 schedule/error). 값·형태 미확정
      responses:
        '200':
          description: 현재 상태
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiOk'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/RobotStatus'
      x-todo:
        - "2차 A-2 — 응답 전체 필드 목록, schedule 값 목록(이동 중/도착/큐 비었음 구분), error 형태 및 자동 해소 여부"
        - "2차 C-4 — stopFlag=true 의 '도착'이 각도 보정 완료 시점인지 위치 도달 시점인지"
        - "2차 E-1 — 권장 폴링 주기 및 rate limit (ACS 검토값 200~500 ms)"

  /robot/brief:
    get:
      tags: [robot]
      operationId: robotBrief
      summary: 현재 상태 조회 (Modbus 정보 포함)
      description: |
        실물 스펙 설명문: "현재 상태 조회 (Modbus 정보 포함)".
        Modbus Input 레지스터(에러코드 11, 맵 일치율 30, WorkStatus 64 등)에 대응하는 값이
        여기 실려 있을 가능성이 높다. **에러코드를 REST 로 얻는 유력 경로**이므로
        실기 확인 시 `/robot/status` 와 응답을 나란히 떠서 비교할 것.
      x-confidence: INFERRED
      x-source: 실물 스펙 /robot/brief (설명문). 응답 필드 미확인
      responses:
        '200':
          $ref: '#/components/responses/Envelope'
      x-todo:
        - "2차 A-2 — /robot/status 와의 필드 차이, Modbus 항목의 키 이름"

  # ---------------------------------------------------------------- 주행 제어
  /robot/state:
    get:
      tags: [robot]
      operationId: robotStateGet
      summary: 현재 주행 단계 조회
      description: |
        실물 스펙 설명문: "현재 주행 단계 조회".
        `POST /robot/state` 가 받는 값과 같은 집합을 돌려줄 것으로 보이며,
        그렇다면 **`state` 값 목록을 실기에서 관찰로 확보할 수 있는 경로**다(2차 C-1 대체 확인 수단).
      x-confidence: INFERRED
      x-source: 실물 스펙 GET /robot/state
      responses:
        '200':
          $ref: '#/components/responses/Envelope'
    post:
      tags: [robot]
      operationId: robotStatePost
      summary: 주행 제어 (시작 · 정지 · 일시정지) — 목적지 교체의 선행 호출
      description: |
        실물 스펙 설명문: "주행 시작/정지/일시정지", 예제 body `{"state": "stop"}`.
        진행 중 이동의 중지에 사용한다(1차 2.7 회신).
        REST 단독으로 정지가 가능하므로 **Modbus 주행 정지(Holding 12) 의존을 제거할 수 있다**.

        **미확정 — `state` 의 값 목록.** 실물 스펙에 예제 `"stop"` 하나만 있다.
        특히 **정지와 큐 전체 삭제가 구분되는지**가 불명이며, 이는 Order 교체 시퀀스의 정확성에 직결된다.
        `POST /robot/task/clear` 가 큐 삭제를 담당할 가능성이 있다(2차 C-2).
      x-confidence: CONFIRMED
      x-source: 실물 스펙 POST /robot/state (body 필드·예제값 확정) + 1차 2.6/2.7 회신(용도)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StateRequest'
            examples:
              stop:
                value: {state: "stop"}
      responses:
        '200':
          $ref: '#/components/responses/Envelope'
      x-todo:
        - "2차 C-1 — state 값 전체 목록, 정지 vs 큐 삭제 구분, 재개 가능 여부, 정지 완료(감속 완료) 확인 방법"
        - "2차 C-5 — 소프트 정지와 하드웨어 비상정지의 관계, 정지 중 /go 발행 시 동작"

  /robot/hold:
    post:
      tags: [robot]
      operationId: robotHold
      summary: 주행 일시정지
      description: |
        실물 스펙 설명문: "주행 일시정지", body `{block: bool}`.
        `state: "stop"` 과 달리 **큐를 보존한 채 멈추는 용도**로 보인다(= VDA 5050 의 일시정지에 대응).
        Order 취소에는 쓰지 말 것.
      x-confidence: INFERRED
      x-source: 실물 스펙 POST /robot/hold
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                block:
                  type: boolean
                  description: true = 일시정지, false = 해제 (추정)
      responses:
        '200':
          $ref: '#/components/responses/Envelope'
      x-todo:
        - "2차 C-1 — hold 와 state:stop 의 차이, hold 중 큐 보존 여부"

  /robot/task/clear:
    post:
      tags: [robot]
      operationId: robotTaskClear
      summary: 설정한 Task 클리어 (큐 비우기 후보)
      description: |
        실물 스펙 설명문: "설정한 Task 클리어".
        **`/robot/go` 로 쌓인 목적지 큐까지 비우는지가 핵심 미확인 사항**이다.
        비운다면 Order 교체 시퀀스는 `state:stop` → `task/clear` → `go` 가 되고,
        비우지 않는다면 `state` 의 다른 값이 큐 삭제를 담당해야 한다.
        확정 전에는 **교체 시퀀스에 이 호출을 넣지 말 것** (동작이 불명확한 상태로 넣으면 안전 쪽이 아니다).
      x-confidence: UNCONFIRMED
      x-source: 실물 스펙 POST /robot/task/clear (설명문만)
      responses:
        '200':
          $ref: '#/components/responses/Envelope'
      x-todo:
        - "2차 C-2 — /go 큐를 비우는가, /plan/task 만 비우는가"

  # ---------------------------------------------------------------- 위치·재측위
  /robot/pose:
    get:
      tags: [pose]
      operationId: robotPoseGet
      summary: 현재 좌표 조회 (라이다 센싱값 및 **맵 일치율** 포함)
      description: |
        실물 스펙 설명문: "로봇의 현재 좌표 조회 (좌표기반 라이다 센싱 값 및 맵 일치율 포함)".

        **층 전환 게이트의 판정 지표를 REST 로 읽을 수 있다는 뜻**이다.
        기존 설계는 맵 일치율을 Modbus Input 30 에서 읽는 것을 전제했으나, 그 의존을 제거할 수 있다.
        남은 것은 **"얼마 이상이면 신뢰"인 임계값**뿐이며 이는 벤더만 답할 수 있다(2차 A-3).
      x-confidence: CONFIRMED
      x-source: 실물 스펙 GET /robot/pose (설명문에 맵 일치율 명시)
      responses:
        '200':
          description: 현재 위치 + 라이다 + 맵 일치율
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiOk'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/RobotPose'
      x-todo:
