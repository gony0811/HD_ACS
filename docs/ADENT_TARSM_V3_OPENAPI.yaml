    post:
      tags: [pose]
      operationId: robotPosePost
      summary: 위치 보정 (재측위) — initPosition 구현체
      description: |
        실물 스펙 설명문: "로봇 위치 보정", body `{x, y, rz, tuneFlag}`.

        **1차 질의 3장에서 Modbus PoseSearch(Holding 20~26)로만 가능하다고 보았던 재측위의
        REST 경로가 존재한다.** 층 전환 절차(맵 전환 → 초기 추정 위치 주입 → 수렴 확인)를
        Modbus 없이 REST 단일 경로로 구현할 수 있다.

        VDA 5050 `initPosition` 액션의 실제 구현체가 이것이다.

        **`tuneFlag` 의 의미가 미확인**이다. 후보: (a) 주변 탐색까지 수행할지, (b) 미세 보정만 할지.
        의미에 따라 "위치를 아는 상태의 보정"과 "층 전환 직후의 전역 탐색"이 갈리므로 확인 필수(2차 B-1).
      x-confidence: CONFIRMED
      x-source: 실물 스펙 POST /robot/pose (경로·body 필드 확정). tuneFlag 의미는 미확인
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PoseRequest'
      responses:
        '200':
          $ref: '#/components/responses/Envelope'
      x-todo:
        - "2차 B-1 — tuneFlag 의미, 수렴까지 소요시간, 성공/실패 확인 방법"
        - "2차 B-2 — Modbus PoseSearch(Holding 20~26)와 동일 기능인지"
        - "2차 B-3 — 유사 형상 구역에서의 오수렴 방지책"

  # ---------------------------------------------------------------- Modbus 우회
  /robot/modbus:
    post:
      tags: [robot]
      operationId: robotModbusWrite
      summary: 홀딩 레지스터 값 설정 (Modbus 기능의 REST 경로)
      description: |
        실물 스펙 설명문: "홀딩 레지스터 값 설정", body `{address, value}`. 다건은 `/robot/modbus/bulk`.

        **Modbus TCP 세션을 따로 열지 않고 레지스터 기반 기능을 트리거할 수 있다는 뜻**이다.
        온보드 S/W 의 통신 경로를 REST 하나로 통일할 수 있고, Modbus 클라이언트 의존을 줄인다.
        다만 전용 REST 경로(`/robot/pose`, `/robot/state`)가 있는 기능은 그쪽을 우선하고,
        이 엔드포인트는 **전용 경로가 없는 레지스터에만** 쓴다(2차 E-2 로 벤더 권장 확인).
      x-confidence: CONFIRMED
      x-source: 실물 스펙 POST /robot/modbus
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [address, value]
              properties:
                address:
                  type: integer
                  description: 홀딩 레지스터 주소 (Modbus 레지스터 맵 매뉴얼 기준)
                value:
                  type: integer
      responses:
        '200':
          $ref: '#/components/responses/Envelope'
      x-todo:
        - "2차 E-2 — 동일 기능에 REST 전용 경로와 modbus 경로가 함께 있을 때 벤더 권장"

  # ---------------------------------------------------------------- 맵
  /map:
    get:
      tags: [map]
      operationId: mapList
      summary: 저장된 맵 목록
      description: 층별 맵 4장을 두고 전환하는 운용을 택할 경우의 조회 경로.
      x-confidence: CONFIRMED
      x-source: 실물 스펙 GET /map
      responses:
        '200':
          $ref: '#/components/responses/Envelope'

  /map/info:
    get:
      tags: [map]
      operationId: mapInfo
      summary: 현재 로드된 맵 정보
      description: |
        VDA 5050 상태 보고의 `mapId` 근거이자, **ACS 와 로봇의 맵 버전 일치 확인** 수단 후보다.
        응답에 맵 이름 외에 버전/해시/갱신시각이 포함되는지 확인 필요(2차 D-3).
      x-confidence: INFERRED
      x-source: 실물 스펙 GET /map/info
      responses:
        '200':
          $ref: '#/components/responses/Envelope'
      x-todo:
        - "2차 D-3 — 응답 필드, 맵 버전 식별자 유무"

  /map/load:
    post:
      tags: [map]
      operationId: mapLoad
      summary: 맵 로드 (층별 맵 전환 경로)
      description: |
        실물 스펙 설명문: "맵 로드", body `{name: "example.map"}`.

        **통합맵 단일화 외에 "층별 맵 4장 + 전환" 이라는 대안이 실재한다는 뜻**이다.
        벤더는 통합맵을 권장했으나(1차 3.1/3.2 회신), 통합맵은 200 m × 200 m 한도와
        타일 배치 오차라는 부담이 있다. 두 방식의 비교 판단에 필요한 것은
        **로드 소요시간**과 **로드 직후 재측위 필요 여부**이며 이를 2차 D-1/D-2 로 질의 중이다.

        로드 직후에는 로봇이 자기 위치를 모를 것이므로 `POST /robot/pose` 가 뒤따라야 한다고 본다(추정).
      x-confidence: CONFIRMED
      x-source: 실물 스펙 POST /map/load (경로·body 확정). 후속 절차는 추정
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  example: "example.map"
      responses:
        '200':
          $ref: '#/components/responses/Envelope'
      x-todo:
        - "2차 D-1 — 통합맵 방식 vs 층별 맵 전환 방식의 벤더 권장 비교"
        - "2차 D-2 — 로드 소요시간, 로드 중 주행 차단 여부, 로드 직후 필요한 후속 절차"

  # ---------------------------------------------------------------- 거점
  /plan/waypoint:
    post:
      tags: [plan]
      operationId: waypointCreate
      summary: 거점 등록 (ACS 산출 정차 좌표의 주입 경로)
      description: |
        실물 스펙 body: `{name, pose: {x, y, rz}}`. 조회는 `/plan/waypoint/list`,
        수정/삭제는 `/plan/waypoint/{id}` (PATCH/DELETE).

        **거점을 맵 에디터 수작업 없이 REST 로 등록/수정할 수 있다**는 점이 중요하다.
        ACS 가 산출한 검사 정차 좌표를 그대로 밀어 넣을 수 있다.
        단 좌표는 **현재 로드된 맵의 좌표계**(통합맵 운용 시 통합맵 좌표) 기준이어야 한다(2차 D-5).
      x-confidence: CONFIRMED
      x-source: 실물 스펙 POST /plan/waypoint
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, pose]
              properties:
                name:
                  type: string
                pose:
                  $ref: '#/components/schemas/Pose'
      responses:
        '200':
          $ref: '#/components/responses/Envelope'
      x-todo:
        - "2차 D-5 — 거점 좌표의 기준 좌표계(통합맵/층별맵), 맵 저장(/map/save) 없이 영속되는지"

components:

  responses:
    Envelope:
      description: |
        공통 envelope. **실물 스펙에는 응답 스키마가 없으므로**(모든 항목 `200 OK`),
        아래 형태는 1차 2.1 회신 문언에 근거한 것이다.
        HTTP 상태코드가 아니라 **body 의 `code` 로 성공/실패를 판정**한다.
      content:
        application/json:
          schema:
            oneOf:
              - $ref: '#/components/schemas/ApiOk'
              - $ref: '#/components/schemas/ApiError'
          examples:
            ok: {value: {code: 0, data: {}}}
            fail: {value: {code: 1001, message: "실패 사유 문자열"}}

  schemas:

    ApiOk:
      type: object
      description: 성공 응답 envelope (1차 2.1 회신)
      x-confidence: CONFIRMED
      required: [code]
      properties:
        code:
          type: integer
          enum: [0]
          description: 성공은 항상 0
        data:
          type: object
          description: 엔드포인트별 payload. 없으면 빈 객체
          additionalProperties: true

    ApiError:
      type: object
      description: 실패 응답 envelope (1차 2.1 회신)
      x-confidence: CONFIRMED
      required: [code, message]
      properties:
        code:
          type: integer
          description: |
            0 이 아닌 실패 코드. **값 목록 미확보** — 실물 스펙에도 없다.
            로봇 에러코드(Modbus Input 11)와 같은 체계인지도 미확인 (2차 A-1/A-4).
          x-confidence: UNCONFIRMED
        message:
          type: string
          description: 실패 사유 문자열

    Pose:
      type: object
      description: |
        맵 좌표계 상의 위치·자세. **원점 = 맵 좌측 하단**, `rz` 는 맵 X축 기준 CCW 라디안 (1차 2.5 회신).
      x-confidence: CONFIRMED
      required: [x, y, rz]
      properties:
        x:
          type: number
          format: double
          description: X [m]
          example: 12.34
        y:
          type: number
          format: double
          description: Y [m]
          example: 5.67
        rz:
          type: number
          format: double
          description: 방위각 [rad], 맵 X축 기준 CCW
          example: 1.5708

    GoRequest:
      allOf:
        - $ref: '#/components/schemas/Pose'
        - type: object
          description: |
            이동 목적지.

            층 운용을 통합맵으로 갈 경우 여기 실리는 좌표는 **통합맵 좌표**이며,
            층별 좌표 → 통합맵 좌표 오프셋 변환은 HD_AMR 온보드 S/W 책임이다.
            ACS 의 VDA 5050 계약(층별 mapId·층별 좌표)은 어느 방식이든 그대로 유지된다.
          required: [stopFlag]
          properties:
            stopFlag:
              type: boolean
              description: |
                - `true`  — 해당 지점에 **정차하고 각도(rz)까지 보정**
                - `false` — 해당 지점 **근처에서 정차하고 바로 다음 목적지로 이동**

                검사 정차점은 코봇 정렬 전제(노드 theta = 벽 정면, VDA 사양서 §4.4)가 있으므로
                **항상 `true`** 로 발행한다. `false` 는 경유점 전용이며 현 ACS 계약에 경유점 개념이 없다.
              x-confidence: CONFIRMED
              x-source: 1차 2.4 회신
              example: true
      x-confidence: CONFIRMED
      x-source: 실물 스펙 /robot/go body + 1차 2.4/2.5 회신(의미)

    PoseRequest:
      allOf:
        - $ref: '#/components/schemas/Pose'
        - type: object
          description: 재측위 시 로봇에 주는 **초기 추정 위치**.
          required: [tuneFlag]
          properties:
            tuneFlag:
              type: boolean
              description: |
                **의미 미확인.** 후보 — (a) 주변 탐색 수행 여부, (b) 미세 보정만 수행.
                층 전환 직후처럼 위치 오차가 큰 상황에서 어느 값을 써야 하는지가 이 의미에 달려 있다.
              x-confidence: UNCONFIRMED
              x-todo: "2차 B-1"
      x-confidence: CONFIRMED
      x-source: 실물 스펙 POST /robot/pose body (필드명 확정, tuneFlag 의미 미확정)

    RobotStatus:
      type: object
      description: |
        `GET /robot/status` 의 `data`. **회신에 언급된 2개 필드만** 담은 골격이며 실제 응답은 더 넓다.
        실물 스펙에 응답 스키마가 없어 확정할 수 없다.
      x-confidence: INFERRED
      properties:
        schedule:
          description: |
            이동 작업(큐) 진행 상태. **값 목록·자료형 미확정** (2차 A-2).
            온보드 구현이 판정해야 하는 것: 이동 중 / 도착 완료 / 큐 비었음.
          x-confidence: UNCONFIRMED
          x-todo: "2차 A-2 — 값 목록과 각 의미, 자료형(문자열 enum? 객체?)"
        error:
          description: |
            현재 오류 상태. **형태 미확정**(단일 코드인지 배열인지), 해소 시 자동으로 비워지는지도 미확인.
            VDA 5050 errorType(`drivingFailed` / `localizationLost` / `equipmentError` / `emergencyStopActive`)
            매핑 테이블이 이 값 목록에 의존한다 (2차 A-1).
          x-confidence: UNCONFIRMED
          x-todo: "2차 A-1/A-2 — 에러코드 전체 목록과 error 필드 형태. /robot/brief 응답도 함께 확인"
      additionalProperties: true

    RobotPose:
      type: object
      description: |
        `GET /robot/pose` 의 `data`. 실물 스펙 설명문상 **현재 좌표 + 라이다 센싱값 + 맵 일치율**을 포함한다.
        **필드명은 미확인** — 아래는 자리표시자다.
      x-confidence: INFERRED
      x-source: 실물 스펙 GET /robot/pose 설명문
      properties:
        matchRate:
          description: |
            **맵 일치율(추정 필드명).** 층 전환 성공 판정의 근거값.
            스케일(0~1 인지 0~100 인지)과 **신뢰 임계값**이 모두 미확인이다 (2차 A-3).
          x-confidence: UNCONFIRMED
      additionalProperties: true

    StateRequest:
      type: object
      description: |
        `POST /robot/state` 의 body. 실물 스펙 예제는 `{"state": "stop"}` 하나뿐이며
        **값 전체 목록은 미확인**이다 (2차 C-1).
      x-confidence: CONFIRMED
      x-source: 실물 스펙 POST /robot/state (필드명·예제값)
      required: [state]
      properties:
        state:
          type: string
          description: |
            주행 상태. 확인된 값은 `"stop"` 뿐. `start`/`pause` 계열이 있을 것으로 보이나 미확인이며,
            **큐를 비우는 값이 별도로 있는지**가 Order 교체 시퀀스에 직결된다.
          example: "stop"
          x-confidence: UNCONFIRMED
          x-todo: "2차 C-1 — 값 전체 목록"

