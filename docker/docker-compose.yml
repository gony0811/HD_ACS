services:
  postgres:
    image: postgres:16
    container_name: dev-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      # 컨테이너 내부 데이터 경로 (볼륨 위치와 맞춤)
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # DB 최초 초기화 시(빈 pgdata 볼륨) 스키마 자동 적용.
      # 알파벳 순서로 실행되므로 접두어 01_/02_ 로 순서를 강제한다.
      # schema.sql 은 대부분의 마이그레이션이 통합된 최신본이고,
      # work_item(2026-08-10)만 별도로 추가 적용한다(그 외 migrations 는 이미 반영됨).
      # 주의: 초기화 스크립트는 pgdata 가 비어 있을 때만 실행된다.
      #       스키마 변경 후에는 `docker compose down -v` 로 볼륨을 지우고 재기동해야 반영된다.
      - ../db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ../db/migrations/2026-08-10_work_item.sql:/docker-entrypoint-initdb.d/02_work_item.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: dev-rabbitmq
    restart: unless-stopped
    hostname: dev-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "5672:5672"    # AMQP
      - "15672:15672"  # 관리 콘솔 (http://localhost:15672)
      - "1883:1883"    # MQTT
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5

volumes:
  pgdata:
  rabbitmq_data:
